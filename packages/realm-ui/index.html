<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realm UI</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Realm</h1>
        <div id="controls"></div>
      </header>

        <section id="primary-panel">

        <section id="host-panel">
          <h2>Android Auto (host, polled)</h2>
          <img id="host-view" alt="Host capability view" />
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
