# xrdp.ini — static RDP-to-VNC bridge for realm-ubuntu.
#
# Unlike xrdp's default config, this does NOT spawn a new Xorg/Xvnc
# session via sesman. It bridges directly to the x11vnc server that
# start-realm.sh already runs against the container's Xvfb display
# (127.0.0.1:5901, no password — matches x11vnc's `-nopw`), using
# xrdp's built-in libvnc.so connector. `autorun` forces this single
# section so no session-chooser prompt is shown to RDP clients.

[Globals]
ini_version=1
fork=true
port=3389
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
allow_channels=true
max_bpp=32
new_cursors=true
use_fastpath=both
autorun=vnc-bridge

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=true

[Channels]
rdpdr=false
rdpsnd=false
drdynvc=false
cliprdr=true
rail=false

[vnc-bridge]
name=vnc-bridge
lib=libvnc.so
ip=127.0.0.1
port=5901
username=na
password=na
