name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Derive package directory from tag
        id: pkg
        run: |
          NAME="${GITHUB_REF_NAME%-v*}"
          case "$NAME" in
            api)       DIR="realm-api" ;;
            browser)   DIR="realm-browser" ;;
            cli)       DIR="realm-cli" ;;
            container) DIR="realm-container" ;;
            core)      DIR="realm-core" ;;
            ubuntu)    DIR="realm-ubuntu" ;;
            veil)      DIR="realm-veil" ;;
            sandbox)   DIR="realm-sandbox" ;;
            host)      DIR="realm-host" ;;
            *)
              echo "::error::Unknown package prefix '$NAME' in tag $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # npm >= 11.5.1 does the trusted-publishing (OIDC) exchange itself. pnpm pack first so
      # workspace:* dependencies become real version ranges in the published package.json.
      - name: Set up npm trusted publishing
        run: npm install --global npm@11.5.1

      - name: Pack and publish
        working-directory: packages/${{ steps.pkg.outputs.dir }}
        run: |
          rm -f *.tgz
          pnpm pack
          npm publish ./*.tgz --access public
